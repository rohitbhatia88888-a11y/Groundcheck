# Reranked experiment: identical to baseline except retrieval casts a wider
# net (retrieval_top_k 5 -> 20) and a cross-encoder reranks that pool down to
# the same top-5 the generator sees. Isolates the effect of reranking itself
# — everything else (chunker, embedder, generator) is unchanged from
# baseline.yaml, so results/experiments.csv's two rows are a controlled
# comparison.
name: reranked

raw_data_dir: data/raw
golden_set_path: eval/golden_set.json

chunker:
  type: fixed_size
  params:
    chunk_size: 1000
    chunk_overlap: 200

embedder:
  type: sentence_transformers
  params:
    model_name: all-MiniLM-L6-v2

vector_store:
  type: qdrant
  params:
    collection_name: reranked
    location: ":memory:"   # point at http://localhost:6333 for a real run

reranker:
  type: cross_encoder
  params:
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2

generator:
  type: openrouter
  params:
    model: openai/gpt-4o-mini   # any model id OpenRouter exposes; swap freely

retrieval_top_k: 20   # wide candidate pool for the cross-encoder to sort through
rerank_top_k: 5       # same top-5 context size as baseline.yaml — isolates reranking
