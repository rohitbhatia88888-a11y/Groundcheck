# See DEPLOY.md. Rename `app` after `fly launch` generates/confirms one for you.
app = "rag-eval-app"
primary_region = "iad"

[build]

[env]
  RAG_CONFIG_PATH = "configs/baseline.yaml"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
