# fly.toml app configuration file generated for groundcheck on 2026-09-16T14:38:03+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'groundcheck'
primary_region = 'ams'

[build]
[env]
  RAG_CONFIG_PATH = 'configs/baseline.yaml'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '90s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
  cpus = 1
  memory_mb = 2048
